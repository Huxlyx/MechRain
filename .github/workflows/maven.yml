# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "mechrain-cli/**"
      - "mechrain-cli-launcher/**"
      - "mechrain-server/**"
      - "mechrain-common/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mechrain-cli/**"
      - "mechrain-cli-launcher/**"
      - "mechrain-server/**"
      - "mechrain-common/**"
      - ".github/workflows/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.cli }}
      launcher: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.launcher }}
      server: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.server }}
      common: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'mechrain-cli/**'
            launcher:
              - 'mechrain-cli-launcher/**'
            server:
              - 'mechrain-server/**'
            common:
              - 'mechrain-common/**'

  build-common:
    needs: changes
    if: needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # install statt verify, damit Server/CLI es als Dependency finden
      - name: Install mechrain-common to local Maven repo
        working-directory: mechrain-common
        run: mvn -B -ntp install

  build-server:
    needs: changes
    # baue Server wenn Server geändert ODER Common geändert wurde
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install mechrain-common to local Maven repo
        working-directory: mechrain-common
        run: mvn -B -ntp install

      - name: Build mechrain-server
        working-directory: mechrain-server
        run: mvn -B -ntp verify

      - name: Upload mechrain-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechrain-server
          path: mechrain-server/target/mechrain-server-*-all.jar
          if-no-files-found: ignore

  build-cli:
    needs: changes
    # baue CLI wenn CLI geändert ODER Common geändert wurde
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install mechrain-common to local Maven repo
        working-directory: mechrain-common
        run: mvn -B -ntp install

      - name: Build mechrain-cli
        working-directory: mechrain-cli
        run: mvn -B -ntp verify

      - name: Upload mechrain-cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechrain-cli
          path: mechrain-cli/target/mechrain-cli-*-all.jar
          if-no-files-found: ignore

  build-cli-launcher:
    needs: changes
    # baue launcher wenn änderungen erkannt
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build mechrain-cli-launcher
        working-directory: mechrain-cli-launcher
        run: mvn -B -ntp verify

      - name: Upload mechrain-cli-launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechrain-cli-launcher
          path: mechrain-cli-launcher/target/mechrain-cli-launcher-*-all.jar
          if-no-files-found: ignore

  deploy:
    needs: [ changes, build-server, build-cli, build-cli-launcher ]
    # Only deploy if we're on main, no needed job failed, and at least one module changed
    if: |
      !failure() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.launcher == 'true' || needs.changes.outputs.common == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
        continue-on-error: true

      - name: Prepare artifacts
        run: |
          mkdir -p deploy
          if [ -d release-artifacts ]; then
            find release-artifacts -type f -name "*.jar" -exec cp {} deploy/ \;
          fi
          echo "Artifacts ready for deployment:"
          ls -lh deploy/ || echo "No artifacts found"

      - name: Check if artifacts exist
        run: |
          if [ ! "$(ls -A deploy/)" ]; then
            echo "No artifacts found in deploy directory!"
            exit 1
          fi
          echo "Found $(ls deploy/*.jar 2>/dev/null | wc -l) JAR files"

      - name: Get build timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.timestamp.outputs.date }}
          name: Release ${{ steps.timestamp.outputs.date }}
          body: |
            Automated release build from commit ${{ github.sha }}
            
            ## Artifacts
            - **mechrain-server**: Full-featured device monitoring server
            - **mechrain-cli**: Interactive terminal client
            - **mechrain-cli-launcher**: Bootstrap launcher for CLI updates
            
            Run with: `java -jar <artifact>.jar`
          files: deploy/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
